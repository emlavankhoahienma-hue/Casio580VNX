name: Build Casio580VNX Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA (Sideloadly / TrollStore)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build Application (unsigned)
        run: |
          xcodebuild -project Casio580VNX.xcodeproj \
            -scheme Casio580VNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Casio580VNX.app Payload/
          zip -qr Casio580VNX-unsigned.ipa Payload
          ls -lh Casio580VNX-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Casio580VNX-unsigned-ipa
          path: Casio580VNX-unsigned.ipa
          retention-days: 14
